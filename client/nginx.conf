# ============================================
# Nginx configuration for the frontend
# ============================================
# Reverse proxies:
#   /api/*  → backend NestJS server (server:3001)
#   /*      → Next.js standalone server (localhost:3000)
# Also serves Next.js static assets directly.

server {
    listen 80;
    server_name localhost;

    # ----------------------------------------
    # Reverse proxy: forward API calls to the
    # backend NestJS container (service: server)
    # ----------------------------------------
    location /api/ {
        # Strip the /api prefix before forwarding
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------
    # Serve Next.js static assets directly
    # from the filesystem for better performance
    # ----------------------------------------
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------
    # Reverse proxy: all other requests go to
    # the Next.js standalone Node.js server
    # ----------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
