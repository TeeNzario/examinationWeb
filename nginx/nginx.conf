events {}

http {

  server {
    listen 80;
    server_name teenzario.my.id;

    location / {
      proxy_pass http://client:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name api.teenzario.my.id;

    location / {
      proxy_pass http://server:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

}